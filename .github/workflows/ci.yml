name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sample_data:
        description: 'Which sample CSV to run (sample1.csv or sample2.csv)'
        required: false
        default: 'sample1.csv'
      run_only_integration:
        description: 'If true, skip tests and run only the integration script'
        required: false
        default: 'false'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run test suite
        run: python -m pytest -q

  integration:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: arthashree:ci

      - name: Run integration in container
        run: |
          docker run --rm -v ${{ github.workspace }}:/home/arthuser/app -w /home/arthuser/app arthashree:ci python tools/ci_integration.py "${{ github.event.inputs.sample_data }}"

      - name: Validate generated run-card
        run: |
          if [ -f tools/artifacts/summary.json ]; then
            python tools/validate_run_card.py tools/artifacts/summary.json
          else
            echo "No summary.json found; skipping run-card validation"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: tools/artifacts
