name: Build and Publish Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag for the image (e.g., v1.0.0 or ci-${{ github.run_id }})'
        required: false
        default: 'latest'
      publish:
        description: 'If true, push the image to GHCR (requires permissions)'
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: ${{ github.event.inputs.publish == 'true' }}
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event.inputs.publish == 'true' }}
          tags: ghcr.io/${{ github.repository_owner }}/arthashree:${{ github.event.inputs.image_tag }}
